set_breezer:
  name: Set Breezer
  description: Configure Tion breezer parameters.
  target:
    entity:
      domain: climate
      integration: neo_tion
  fields:
    mode:
      name: Mode
      description: "off - выключен, fan - заданная скорость, auto - автоматическая"
      selector:
        select:
          options:
            - "off"
            - "fan"
            - "auto"
    targetco2:
      name: Target CO2
      description: Desired CO2 level in ppm (for auto mode).
      selector:
        number:
          min: 400
          max: 2000
          unit_of_measurement: "ppm"
    speed:
      name: Speed
      description: "1-6. If mode is auto, this sets the max speed (min is 0)."
      selector:
        number:
          min: 1
          max: 6
    targettemp:
      name: Target Temperature
      description: Desired heating temperature.
      selector:
        number:
          min: 10
          max: 30
          unit_of_measurement: "°C"
    heat:
      name: Heater
      description: Turn heater on/off.
      selector:
        boolean:
    swing:
      name: Swing
      description: Louver position.
      selector:
        select:
          options:
            - "indoor"
            - "outdoor"
            - "both"